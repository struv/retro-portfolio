        <script type="application/json" data-article-content>"# Welcome to My Digital Realm\n\n*Introduction updated October 2026.*\n\nThis is where I keep notes on web development, music, and personal experiments.\n\n## About This Space\n\nMy professional work has included patient intake, vaccine inventory, and operational dashboards. I care about understanding a workflow, getting useful software into people's hands, and helping them use it after launch.\n\nThe [Projects page](../index.html#projects) separates that work from college team projects and personal demos. Here on the blog, I share things I try and learn along the way.\n\n## Outside Work\n\nI make music and enjoy browser experiments with sound and visuals. This site's retro design and music player are part of that interest.\n\nYou can browse the demos, read the notes, or [get in touch](../index.html).\n"</script>
